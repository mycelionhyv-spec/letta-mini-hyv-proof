name: Council contract tests

on:
  push:
    branches:
      - "council/**"
  pull_request:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run receipt-control tests
        run: python -m unittest discover -s tests -v
